name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'scripts/check_docs.py'
      - 'test/docs_check/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'scripts/check_docs.py'
      - 'test/docs_check/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra docs --group docs-test
      - run: uv run --no-sync pytest -q test/docs_check
      - run: uv run --no-sync python scripts/check_docs.py
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync python scripts/check_docs.py --site-dir site
      - uses: actions/upload-pages-artifact@v3
        if: >-
          github.ref == 'refs/heads/main' &&
          github.event.repository.has_pages == true
        with:
          path: site

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.has_pages == true
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
